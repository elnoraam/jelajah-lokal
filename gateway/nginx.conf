worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Kunci pembatasan: IP asli pengunjung dari Cloudflare, atau IP koneksi jika akses langsung.
  map $http_cf_connecting_ip $client_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }
  limit_req_zone $client_key zone=api:5m   rate=10r/s;
  limit_req_zone $client_key zone=login:5m rate=5r/m;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $client_key;
  proxy_set_header X-Forwarded-For   $client_key;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;

  server {
    listen 80;
    client_max_body_size 256k;

    # Error handler
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_down;

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak permintaan","request_id":"-"}}';
    }

    location @rate_limited_login {
      default_type application/json;
      add_header Retry-After 12 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak percobaan login","request_id":"-"}}';
    }

    location @upstream_down {
      default_type application/json;
      return 503 '{"error":{"code":"upstream_unavailable","message":"Layanan belum siap","request_id":"-"}}';
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Endpoint internal auth-service tidak boleh terjangkau dari luar.
    location ^~ /api/auth/internal {
      return 404;
    }

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      error_page 429 = @rate_limited_login;
      proxy_pass http://auth:8000/login;
    }

    location /api/auth/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://auth:8000/;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://core:8000/;
    }

    location = / {
      default_type application/json;
      return 200 '{"service":"JelajahLokal","docs":"/api/docs","health":"/api/health"}';
    }
  }
}