openapi: 3.1.0
info:
  title: JelajahLokal Core Service
  description: '

    Layanan wisata tersembunyi dan cerita budaya. Semua path relatif terhadap `/api`.


    **Autentikasi**

    - Pengguna aplikasi: `Authorization: Bearer <JWT>` dari `POST /api/auth/login`.

    - Layanan lain (server ke server): header `X-API-Key`, hanya untuk `/feed/*`.

    - Data publik (pencarian, cerita, kondisi) terbuka tanpa autentikasi, tetapi dibatasi
    jumlah pemanggilannya.

    '
  version: 2.0.0
paths:
  /destinations:
    get:
      tags:
      - katalog-destinasi
      summary: Cari destinasi
      operationId: search_destinations_destinations_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          description: Kata kunci nama, alamat, atau deskripsi
          title: Q
        description: Kata kunci nama, alamat, atau deskripsi
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(nature|culture_history|local_culinary|tourism_village|craft)$
          - type: 'null'
          title: Category
      - name: hidden
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true = hanya wisata tersembunyi
          title: Hidden
        description: true = hanya wisata tersembunyi
      - name: lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Lon
      - name: radius_m
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 500000
            exclusiveMinimum: 0
          - type: 'null'
          title: Radius M
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(waiting|published|rejected)$
          - type: 'null'
          description: Hanya berlaku untuk admin
          title: Status
        description: Hanya berlaku untuk admin
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          description: true = kiriman saya (perlu login)
          default: false
          title: Mine
        description: true = kiriman saya (perlu login)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - katalog-destinasi
      summary: Kirim destinasi baru (contributor)
      operationId: create_destination_destinations_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}:
    get:
      tags:
      - katalog-destinasi
      summary: Detail destinasi
      operationId: get_destination_destinations__destination_id__get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/status:
    patch:
      tags:
      - katalog-destinasi
      summary: Terbitkan atau tolak destinasi (admin)
      operationId: set_destination_status_destinations__destination_id__status_patch
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/stories:
    get:
      tags:
      - cerita-budaya
      summary: Daftar cerita sebuah destinasi
      operationId: list_destination_stories_destinations__destination_id__stories_get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/background:
    get:
      tags:
      - cerita-budaya
      summary: Ringkasan latar sejarah (Wikipedia)
      operationId: destination_background_destinations__destination_id__background_get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stories:
    get:
      tags:
      - cerita-budaya
      summary: Daftar cerita (admin dapat memfilter status)
      operationId: list_stories_stories_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(waiting|published|rejected)$
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - cerita-budaya
      summary: Kirim cerita budaya (contributor)
      operationId: create_story_stories_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stories/{story_id}:
    get:
      tags:
      - cerita-budaya
      summary: Isi cerita
      operationId: get_story_stories__story_id__get
      parameters:
      - name: story_id
        in: path
        required: true
        schema:
          type: integer
          title: Story Id
      - name: mode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^short$
          - type: 'null'
          description: short = hanya kutipan singkat (excerpt)
          title: Mode
        description: short = hanya kutipan singkat (excerpt)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stories/{story_id}/status:
    patch:
      tags:
      - cerita-budaya
      summary: Terbitkan atau tolak cerita (admin)
      operationId: set_story_status_stories__story_id__status_patch
      parameters:
      - name: story_id
        in: path
        required: true
