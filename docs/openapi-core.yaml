              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/reviews:
    get:
      tags:
      - ulasan
      summary: Daftar ulasan dan rata-rata rating
      operationId: list_reviews_destinations__destination_id__reviews_get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - ulasan
      summary: Tulis ulasan (login)
      operationId: create_review_destinations__destination_id__reviews_post
      parameters:
      - name: destination_id
        in: path
        required: true
