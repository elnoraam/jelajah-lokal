              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reviews/{review_id}/report:
    post:
      tags:
      - ulasan
      summary: Laporkan ulasan untuk ditinjau (login)
      operationId: report_review_reviews__review_id__report_post
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: integer
          title: Review Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reviews/reported:
    get:
      tags:
      - ulasan
      summary: Ulasan yang dilaporkan (admin)
      operationId: list_reported_reviews_reported_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reviews/{review_id}/moderation:
    patch:
      tags:
      - ulasan
      summary: Sembunyikan atau tampilkan ulasan (admin)
      operationId: moderate_review_reviews__review_id__moderation_patch
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: integer
          title: Review Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plans:
    get:
      tags:
      - rencana-kunjungan
      summary: Rencana kunjungan milik saya
      operationId: list_plans_plans_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - rencana-kunjungan
      summary: Simpan destinasi dan tanggal kunjungan
      operationId: create_plan_plans_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plans/{plan_id}:
    delete:
      tags:
      - rencana-kunjungan
      summary: Hapus rencana kunjungan
      operationId: delete_plan_plans__plan_id__delete
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Plan Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/conditions:
    get:
      tags:
      - kondisi-sekitar-destinasi
      summary: Cuaca dan tingkat risiko di sekitar destinasi
      operationId: conditions_destinations__destination_id__conditions_get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: YYYY-MM-DD, maksimal 14 hari ke depan
          title: Date
        description: YYYY-MM-DD, maksimal 14 hari ke depan
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /destinations/{destination_id}/route:
    get:
      tags:
      - kondisi-sekitar-destinasi
      summary: Rute mobil menuju destinasi
      operationId: route_destinations__destination_id__route_get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          title: Destination Id
      - name: from_lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: From Lat
      - name: from_lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: From Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /feed/destinations:
    get:
      tags:
      - umpan-destinasi
      summary: Umpan destinasi terbit untuk layanan lain (X-API-Key)
      operationId: feed_feed_destinations_get
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO 8601 UTC, contoh 2026-11-20T10:00:00Z
          title: Updated Since
        description: ISO 8601 UTC, contoh 2026-11-20T10:00:00Z
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - umum
      summary: Cek layanan hidup
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    DestinationIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 3
          title: Name
        category:
          type: string
          pattern: ^(nature|culture_history|local_culinary|tourism_village|craft)$
          title: Category
          description: nature | culture_history | local_culinary | tourism_village
            | craft
        description:
          type: string
          maxLength: 4000
          minLength: 20
          title: Description
        lat:
          type: number
          maximum: 6.5
          minimum: -11.5
          title: Lat
        lon:
          type: number
          maximum: 141.5
          minimum: 94.0
          title: Lon
        address:
          anyOf:
          - type: string
            maxLength: 250
          - type: 'null'
          title: Address
        opening_hours:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Opening Hours
        photo_url:
          anyOf:
          - type: string
            maxLength: 500
            pattern: ^https?://
          - type: 'null'
          title: Photo Url
        wikipedia_title:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
          title: Wikipedia Title
      type: object
      required:
      - name
      - category
      - description
      - lat
      - lon
      title: DestinationIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ModerationIn:
      properties:
        hidden:
          type: boolean
          title: Hidden
      type: object
      required:
      - hidden
      title: ModerationIn
    PlanIn:
      properties:
        destination_id:
          type: string
          title: Destination Id
        visit_date:
          type: string
          format: date
          title: Visit Date
        note:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Note
      type: object
      required:
      - destination_id
      - visit_date
      title: PlanIn
    ReviewIn:
      properties:
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
      type: object
      required:
      - rating
      title: ReviewIn
    StatusIn:
      properties:
        status:
          type: string
          pattern: ^(published|rejected)$
          title: Status
        reason:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Reason
      type: object
      required:
      - status
      title: StatusIn
    StoryIn:
      properties:
        title:
          type: string
          maxLength: 150
          minLength: 3
          title: Title
        body:
          type: string
          maxLength: 20000
          minLength: 50
          title: Body
        summary:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Summary
        destination_ids:
          items:
            type: string
          type: array
          maxItems: 10
          minItems: 1
          title: Destination Ids
      type: object
      required:
      - title
      - body
      - destination_ids
      title: StoryIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      in: header
